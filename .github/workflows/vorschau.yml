name: Vorschau bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # jede Nacht, 3 Uhr (Winterzeit) bzw. 4 Uhr (Sommerzeit)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Laufende Bauten nicht abbrechen (ein Abbruch mitten im Hochladen ließe die Website halb aktualisiert);
  # weitere Anstöße warten, nur der jüngste wartende wird ausgeführt.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte aus WordPress abrufen
        run: npm run fetch
      - name: Abgerufene Inhalte im Projekt sichern
        run: |
          git config user.name "Vorschau-Bau"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Inhalte aus WordPress aktualisiert [skip ci]"
            # Falls inzwischen eine neuere Änderung im Projekt liegt: darauf aufsetzen statt abzubrechen
            git pull --rebase origin main
            git push
          fi
      - name: Prototyp bauen (für Google gesperrt)
        run: npm run preview
        env:
          PREVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
      # Echte Fassung für All-Inkl: ohne Vorschau-Banner, mit Prüfbericht als Sperre
      - name: Website für All-Inkl bauen und prüfen
        id: release
        continue-on-error: true
        run: rm -rf _site && npm run release
      - name: Website für All-Inkl bereitstellen
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          include-hidden-files: true
          retention-days: 7
    outputs:
      release: ${{ steps.release.outcome }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Hochladen zu All-Inkl (Ordner /website/) per FTP mit TLS – nur wenn die Zugangsdaten hinterlegt sind
  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        id: creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: echo "ok=$([ -n "$FTP_SERVER" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Sperre durch den Prüfbericht
        if: steps.creds.outputs.ok == 'yes' && needs.build.outputs.release != 'success'
        run: |
          echo "::error::Hochladen gesperrt – der Prüfbericht ist nicht sauber (Details im Schritt „Website für All-Inkl bauen und prüfen“)."
          exit 1
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'yes'
        with:
          name: website
          path: _site
      - name: Zu All-Inkl hochladen (nur geänderte Dateien)
        if: steps.creds.outputs.ok == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./
