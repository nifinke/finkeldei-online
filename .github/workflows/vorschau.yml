name: Website bauen und hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # jede Nacht, 3 Uhr (Winterzeit) bzw. 4 Uhr (Sommerzeit)

permissions:
  contents: write

concurrency:
  group: pages
  # Laufende Bauten nicht abbrechen (ein Abbruch mitten im Hochladen ließe die Website halb aktualisiert);
  # weitere Anstöße warten, nur der jüngste wartende wird ausgeführt.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte aus WordPress abrufen
        run: npm run fetch
      - name: Abgerufene Inhalte im Projekt sichern
        run: |
          git config user.name "Vorschau-Bau"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Inhalte aus WordPress aktualisiert [skip ci]"
            # Falls inzwischen eine neuere Änderung im Projekt liegt: darauf aufsetzen statt abzubrechen
            git pull --rebase origin main
            git push
          fi
      # Website bauen; der Prüfbericht ist die Sperre: bei Abweichungen, fehlenden Seiten oder toten Links bricht der Bau ab
      - name: Website bauen und prüfen
        run: npm run release
      - name: Prüfbericht aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruefbericht
          path: pruefbericht.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Website für All-Inkl bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          include-hidden-files: true
          retention-days: 7

  # Hochladen zu All-Inkl (Ordner /website/) per FTP mit TLS – nur geänderte Dateien
  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site
      - name: Zu All-Inkl hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./
