name: Vorschau bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte aus WordPress abrufen
        run: npm run fetch
      - name: Abgerufene Inhalte im Projekt sichern
        run: |
          git config user.name "Vorschau-Bau"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Inhalte aus WordPress aktualisiert [skip ci]"
            git push
          fi
      - name: Prototyp bauen (für Google gesperrt)
        run: npm run preview
        env:
          PREVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
